# CPU CI: lint, type-check and the default (CPU, tiny-model) test suite, plus a build and
# smoke run of the gateway container image.
#
# GitHub's hosted runners have no NVIDIA GPU and ~14 GB of disk, so installing the committed
# lock file as-is would pull ~3 GB of CUDA 12.4 wheels that can never be used. `pyproject.toml`
# declares the torch wheel index as a named index (`pytorch-cu124`) with `explicit = true`, so
# the smallest correct swap is to rewrite that one URL to the CPU wheel index in place (see the
# step below). GPU-marked tests are deselected by the default `addopts`. The tiny random
# checkpoints the rest of the suite loads are downloaded once into a cached Hugging Face home
# and `TURBOSERVE_REQUIRE_TINY_MODELS=1` makes their absence a failure: skipping them would
# take the engine, the prefix cache, speculative decoding and the gateway-to-engine path out
# of CI without turning the badge red.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + types + cpu tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      # Point the torch index at the CPU wheels.
      #
      # This is done with `sed` rather than the `UV_INDEX` environment variable on purpose: an
      # index supplied through `UV_INDEX` is NOT `explicit`, so uv's first-index strategy then
      # applies to every package that index happens to carry (filelock, idna, jinja2, numpy,
      # setuptools, typing-extensions, ...), silently sourcing and downgrading them from
      # download.pytorch.org and failing outright when a version pin cannot be satisfied there.
      # Editing the URL inside `[[tool.uv.index]]` keeps `explicit = true`, so the index is
      # still consulted for `torch` alone and everything else resolves from PyPI.
      #
      # The edit invalidates the committed CUDA lock, hence it runs *after* `uv lock --check`
      # and the sync below is allowed to re-resolve (no `--frozen`/`--locked`). Nothing is
      # committed back; the checkout is thrown away with the runner.
      - name: Point the torch index at the CPU wheels
        run: |
          sed -i 's|download.pytorch.org/whl/cu124|download.pytorch.org/whl/cpu|' pyproject.toml
          grep -n 'download.pytorch.org' pyproject.toml

      - name: Install dependencies (CPU torch)
        run: uv sync --all-groups

      - name: Show the resolved torch build
        run: uv run python -c "import torch; print(torch.__version__, torch.cuda.is_available())"

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      # A few megabytes in total. `_cached_snapshot` in tests/conftest.py resolves exactly
      # these repos with `local_files_only=True`, so the tests themselves still never reach
      # the network -- the download happens here, once, and is restored from the cache on
      # subsequent runs.
      - name: Cache the tiny test checkpoints
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-${{ hashFiles('tests/conftest.py') }}

      - name: Download the tiny test checkpoints
        run: |
          uv run hf download hf-tiny-v2/tiny-random-Qwen2ForCausalLM
          uv run hf download hf-internal-testing/tiny-random-LlamaForCausalLM

      - name: pytest (CPU)
        env:
          TURBOSERVE_REQUIRE_TINY_MODELS: "1"
        run: uv run pytest -q

      - name: Restore the committed pyproject.toml
        if: always()
        run: git checkout -- pyproject.toml

  # The only place either Dockerfile is exercised. Hosted runners have Docker, so the gateway
  # image (slim CPU base, CPU torch) is built here from the same `make docker-build` a
  # developer runs, then started so that a broken ENTRYPOINT/CMD or a venv that does not
  # survive the multi-stage copy fails the build instead of being discovered at deploy time.
  #
  # Dockerfile.engine is deliberately NOT built here: it layers the CUDA 12.4 torch
  # resolution on nvidia/cuda:12.4.1-runtime, which exceeds a hosted runner's free disk. It is
  # built on the GPU host; see CONTRIBUTING.md#what-has-never-been-executed-here.
  docker:
    name: gateway image build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the gateway image
        run: make docker-build IMAGE=turboserve-gateway:ci

      - name: Report the image size
        run: docker image ls turboserve-gateway:ci

      # The default CMD. `hwinfo` exercises the console script, the copied venv and the
      # non-root user, and prints the record every result file embeds; on a runner with no
      # NVIDIA driver its GPU fields are null, which is a supported outcome, not a failure.
      - name: Smoke-test the image (default CMD)
        run: docker run --rm turboserve-gateway:ci

      - name: Smoke-test the image (explicit subcommand)
        run: docker run --rm turboserve-gateway:ci version

      # The package must be importable from the runtime stage's copied venv rather than from
      # a leftover editable .pth pointing at the builder's /build/src.
      - name: Check the package resolves inside the image
        run: |
          docker run --rm --entrypoint python turboserve-gateway:ci \
            -c "import turboserve, pathlib; p = pathlib.Path(turboserve.__file__); print(p); assert p.is_relative_to('/opt/turboserve'), p"

  # Static validation of everything under deploy/ and scripts/. It is deliberately separate
  # from the `check` job: none of it needs the Python environment, and keeping it apart
  # means a broken manifest is reported as a broken manifest rather than as a failed test
  # run. Nothing here talks to a cluster -- the end-to-end run against a real API server is
  # .github/workflows/kind-e2e.yml.
  k8s:
    name: helm lint + kubeconform + kustomize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.6.7"
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      # `make k8s-lint` is the same command a developer runs locally, so the manifests
      # cannot pass here and fail there. It does: helm lint; four `helm template |
      # kubeconform` renders (defaults, the production vLLM + canary + monitoring shape, the
      # production SGLang shape with speculative decoding and multi-LoRA, and the Argo
      # Rollouts variant -- most of the chart is conditional, and a template that is never
      # rendered is never validated); both kustomize overlays; the Chaos Mesh manifests; and
      # a shell-syntax pass over every script under deploy/ and scripts/.
      #
      # -ignore-missing-schemas is required and is scoped to what it says: ServiceMonitor,
      # PrometheusRule and Rollout are custom resources whose schemas are not part of
      # Kubernetes, so kubeconform reports them as skipped. Every built-in object is still
      # validated with -strict, which rejects unknown fields.
      - name: make k8s-lint
        run: make k8s-lint

      # The chart's guard rails are part of its contract; a values combination that cannot
      # work must fail at render time, not in the cluster.
      - name: chart rejects invalid values
        run: |
          set +e
          helm template turboserve deploy/helm/turboserve --set engine.mode=nonsense >/dev/null 2>&1
          test $? -ne 0 || { echo "engine.mode=nonsense should have failed"; exit 1; }
          helm template turboserve deploy/helm/turboserve \
            --set canary.enabled=true --set canary.argoRollouts.enabled=true >/dev/null 2>&1
          test $? -ne 0 || { echo "canary.enabled + argoRollouts.enabled should have failed"; exit 1; }
          helm template turboserve deploy/helm/turboserve --set engine.mode=sglang \
            --set engine.sglang.speculative.enabled=true \
            --set engine.sglang.speculative.draftModel= >/dev/null 2>&1
          test $? -ne 0 || { echo "EAGLE without a draft model should have failed"; exit 1; }
          echo "every invalid combination was rejected"

      - name: Parse every YAML asset
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          paths = [
              *pathlib.Path(".github/workflows").glob("*.yml"),
              pathlib.Path("docker-compose.yml"),
              pathlib.Path("deploy/prometheus/rules.yaml"),
              pathlib.Path("deploy/prometheus/prometheus.yml"),
              pathlib.Path("deploy/kind/kind-config.yaml"),
              pathlib.Path("deploy/vllm/values-h100.yaml"),
              pathlib.Path("deploy/sglang/values-h100.yaml"),
              *pathlib.Path("deploy/grafana/provisioning").rglob("*.yaml"),
          ]
          failed = False
          for path in paths:
              try:
                  list(yaml.safe_load_all(path.read_text()))
              except yaml.YAMLError as exc:
                  print(f"FAIL {path}: {exc}")
                  failed = True
              else:
                  print(f"ok   {path}")
          sys.exit(1 if failed else 0)
          PY

      - name: The Grafana dashboard is valid JSON with panels
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          dashboard = json.loads(
              pathlib.Path("deploy/grafana/dashboards/turboserve.json").read_text()
          )
          panels = [panel for panel in dashboard["panels"] if panel["type"] != "row"]
          assert dashboard["uid"] == "turboserve-gateway", dashboard["uid"]
          assert panels, "the dashboard has no panels"
          for panel in panels:
              assert panel.get("targets"), f"panel {panel['title']!r} has no query"
          print(f"{len(panels)} panels, all with queries")
          PY

      - name: The error-rate assertion script works
        run: |
          echo '{"scenario":"selftest","summary":{"num_requests":1000,"num_failed":1}}' \
            | python3 deploy/kind/assert_error_rate.py - --min-requests 100
          if echo '{"scenario":"selftest","summary":{"num_requests":1000,"num_failed":50}}' \
            | python3 deploy/kind/assert_error_rate.py - --min-requests 100; then
            echo "a 5% error rate should have failed the assertion"
            exit 1
          fi
