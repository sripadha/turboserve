# Prometheus configuration for the single-node docker-compose stack.
#
# In Kubernetes this file has no equivalent: the Helm chart ships a ServiceMonitor and a
# PrometheusRule and the Prometheus Operator generates the scrape config from them. Here
# there is no operator, so the two jobs are written out by hand and rules.yaml -- the same
# file the chart embeds -- is loaded directly.
#
# The `job` label is pinned to "turboserve" because the availability alerts in rules.yaml
# match on it; the chart's ServiceMonitor sets jobLabel: app.kubernetes.io/name to produce
# the same label in the cluster.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: turboserve-compose

rule_files:
  - /etc/prometheus/rules.yaml

scrape_configs:
  - job_name: turboserve
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          service: turboserve
          component: gateway

  # vLLM exports its own engine metrics (vllm:* series) on the same port as its OpenAI API.
  # It is a separate job because the turboserve alerts must not fire on a vLLM target
  # going away; the gateway reports that as backend errors of its own.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]
        labels:
          service: turboserve
          component: engine

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
