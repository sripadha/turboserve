{{/*
Three Services, because three different callers need three different views of the lanes:

  <name>-gateway          selects *both* lanes. This is the client-facing address and the
                          Prometheus scrape target; the metrics it produces carry the lane
                          label, so one scrape job covers both.
  <name>-gateway-stable   selects the stable lane only.
  <name>-gateway-canary   selects the canary lane only.

The two lane Services are what makes a rollout observable and reversible without editing
anything: the canary controller reads each lane's metrics separately, and pointing the
Ingress at -stable is an instant, total rollback that needs no new pods.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "turboserve.gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turboserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with (merge (dict) .Values.gateway.service.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "turboserve.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
{{- $lanes := list "stable" }}
{{- if .Values.canary.enabled }}{{ $lanes = append $lanes "canary" }}{{ end }}
{{- range $lane := $lanes }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" (include "turboserve.gateway.fullname" $) $lane }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "turboserve.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
    turboserve.io/lane: {{ $lane }}
spec:
  type: ClusterIP
  selector:
    {{- include "turboserve.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
    turboserve.io/lane: {{ $lane }}
  ports:
    - name: http
      port: {{ $.Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
