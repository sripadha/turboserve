{{/*
The standalone engine Deployment: vLLM or SGLang.

Rendered only for the two production modes -- in mock and reference mode the engine lives
inside the gateway process and there is nothing to deploy here. Splitting them in
production buys three things that matter more than the extra hop: the GPU node pool scales
independently of the request-handling tier, a gateway rollout does not restart a process
holding 60 GB of KV cache, and the engine image is an upstream release rather than anything
built in this repository, so its version is a value and not a rebuild.

One Deployment serves both engines because only two things differ between them: the image
and the command line it is started with. The pod shape -- GPU limits, /dev/shm, the model cache, the adapters volume,
the probes, the grace period -- is a property of "a process holding a model on a GPU", not
of which process it is, and duplicating it per engine is how the two would drift apart.

Every flag below comes from values.yaml; see deploy/vllm/README.md and
deploy/sglang/README.md for what each one does, and the values-h100.yaml beside each for a
filled-in single-H100 profile.
*/}}
{{- if include "turboserve.engine.standalone" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "turboserve.engine.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turboserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.engine.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "turboserve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0: a surge pod would need a second GPU, which on a single-GPU node pool
      # means it stays Pending forever and the rollout never completes. Engine restarts
      # are therefore visibly disruptive, which is what the gateway's retry-before-first
      # -byte and the PodDisruptionBudget on the gateway lane are there to absorb.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "turboserve.labels" . | nindent 8 }}
        app.kubernetes.io/component: engine
      {{- with .Values.engine.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "turboserve.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.engine.podSecurityContext | nindent 8 }}
      # Long grace period: a terminating engine should finish the sequences it is decoding
      # rather than truncate every stream it holds.
      terminationGracePeriodSeconds: 120
      {{- if and .Values.engine.adapters.enabled .Values.engine.adapters.sync.enabled }}
      initContainers:
        {{- include "turboserve.adapters.initContainer" . | nindent 8 }}
      {{- end }}
      containers:
        # The container is named after the engine, so `kubectl logs -c sglang` and a pod
        # description say which one is running without reading the image tag.
        - name: {{ .Values.engine.mode }}
          image: {{ include "turboserve.engine.image" . | quote }}
          imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
          {{- if eq .Values.engine.mode "sglang" }}
          # The official SGLang image entrypoints into a shell rather than into its server,
          # so the module is named here; `vllm/vllm-openai` already entrypoints into its
          # OpenAI server, which is why only one of the two modes needs this line. Without
          # it the flags below would be handed to bash and the pod would crash-loop on the
          # first one. docker-compose.yml sets the same entrypoint for the same reason.
          command: ["python3", "-m", "sglang.launch_server"]
          {{- end }}
          args:
            {{- if eq .Values.engine.mode "sglang" }}
            - --model-path
            - {{ .Values.engine.model | quote }}
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.engine.service.port | quote }}
            - --dtype
            - {{ .Values.engine.sglang.dtype | quote }}
            - --context-length
            - {{ .Values.engine.sglang.contextLength | quote }}
            - --mem-fraction-static
            - {{ .Values.engine.sglang.memFractionStatic | quote }}
            - --max-running-requests
            - {{ .Values.engine.sglang.maxRunningRequests | quote }}
            # The prefill token budget per scheduler step. Having one is what makes
            # prefill chunked, so one long prompt cannot stall every stream in flight;
            # SGLang has no separate --enable-chunked-prefill.
            - --chunked-prefill-size
            - {{ .Values.engine.sglang.chunkedPrefillSize | quote }}
            - --tp-size
            - {{ .Values.engine.sglang.tpSize | quote }}
            - --log-level
            - {{ .Values.gateway.logLevel | lower | quote }}
            {{- if eq .Values.engine.quantization "fp8" }}
            # W8A8-FP8 weights and an fp8 KV cache. SGLang names the KV format outright:
            # fp8_e5m2 is the scale-free one, where vLLM's `fp8` means E4M3 with per-tensor
            # scales. A checkpoint that is already quantized declares its scheme itself, so
            # only the KV dtype is passed for it.
            {{- if not .Values.engine.quantizedCheckpoint }}
            - --quantization
            - fp8
            {{- end }}
            - --kv-cache-dtype
            - fp8_e5m2
            {{- end }}
            {{- if not .Values.engine.sglang.enablePrefixCaching }}
            # RadixAttention prefix caching is on unless it is disabled: identical leading
            # tokens adopt the KV pages already in the radix tree, so a shared system
            # prompt is prefilled once per node instead of once per request. Disabling it
            # is what the prefix-cache benchmark's control server does.
            - --disable-radix-cache
            {{- end }}
            {{- if .Values.engine.sglang.speculative.enabled }}
            # Draft-then-verify decoding. The draft occupies GPU memory that
            # memFractionStatic has to leave room for.
            - --speculative-algorithm
            - {{ .Values.engine.sglang.speculative.algorithm | quote }}
            {{- with .Values.engine.sglang.speculative.draftModel }}
            - --speculative-draft-model-path
            - {{ . | quote }}
            {{- end }}
            - --speculative-num-steps
            - {{ .Values.engine.sglang.speculative.numSteps | quote }}
            - --speculative-num-draft-tokens
            - {{ .Values.engine.sglang.speculative.numDraftTokens | quote }}
            {{- end }}
            {{- if .Values.engine.sglang.lora.enabled }}
            - --max-loras-per-batch
            - {{ .Values.engine.sglang.lora.maxLorasPerBatch | quote }}
            {{- if .Values.engine.sglang.lora.paths }}
            # One flag takes every name=path pair, unlike vLLM's repeated --lora-modules.
            - --lora-paths
            {{- range .Values.engine.sglang.lora.paths }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.engine.sglang.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- else }}
            - --model
            - {{ .Values.engine.model | quote }}
            - --served-model-name
            - {{ .Values.engine.model | quote }}
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.engine.service.port | quote }}
            - --max-model-len
            - {{ .Values.engine.vllm.maxModelLen | quote }}
            - --gpu-memory-utilization
            - {{ .Values.engine.vllm.gpuMemoryUtilization | quote }}
            - --max-num-seqs
            - {{ .Values.engine.vllm.maxNumSeqs | quote }}
            - --max-num-batched-tokens
            - {{ .Values.engine.vllm.maxNumBatchedTokens | quote }}
            - --tensor-parallel-size
            - {{ .Values.engine.vllm.tensorParallelSize | quote }}
            - --dtype
            - {{ .Values.engine.vllm.dtype | quote }}
            {{- if eq .Values.engine.quantization "fp8" }}
            # W8A8-FP8 weights and an fp8 KV cache, converted once at load time. vLLM's
            # `fp8` KV dtype is E4M3 with per-tensor scales; SGLang's flag above names
            # fp8_e5m2 instead, which is the one place the two argv genuinely differ. A
            # checkpoint that is already quantized declares its scheme itself, and vLLM
            # refuses a --quantization that disagrees with it, so it renders only the KV
            # dtype.
            {{- if not .Values.engine.quantizedCheckpoint }}
            - --quantization
            - fp8
            {{- end }}
            - --kv-cache-dtype
            - fp8
            {{- end }}
            {{- if .Values.engine.vllm.enablePrefixCaching }}
            # Automatic prefix caching: identical leading blocks of a prompt reuse the KV
            # already in the cache, so a shared system prompt is prefilled once per node
            # instead of once per request.
            - --enable-prefix-caching
            {{- end }}
            {{- if .Values.engine.vllm.enableChunkedPrefill }}
            - --enable-chunked-prefill
            {{- end }}
            {{- if .Values.engine.vllm.speculative.enabled }}
            # Draft-then-verify decoding. The draft model must share the target's
            # tokenizer, and it occupies GPU memory that gpuMemoryUtilization has to leave
            # room for.
            - --speculative-model
            - {{ .Values.engine.vllm.speculative.model | quote }}
            - --num-speculative-tokens
            - {{ .Values.engine.vllm.speculative.numSpeculativeTokens | quote }}
            {{- end }}
            {{- if .Values.engine.vllm.lora.enabled }}
            - --enable-lora
            - --max-loras
            - {{ .Values.engine.vllm.lora.maxLoras | quote }}
            - --max-lora-rank
            - {{ .Values.engine.vllm.lora.maxLoraRank | quote }}
            {{- range .Values.engine.vllm.lora.modules }}
            - --lora-modules
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.engine.vllm.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.engine.service.port }}
              protocol: TCP
          env:
            {{- if eq .Values.engine.mode "vllm" }}
            # SGLang takes its level as a flag (--log-level, above); vLLM reads this.
            - name: VLLM_LOGGING_LEVEL
              value: {{ .Values.gateway.logLevel | quote }}
            {{- end }}
            - name: HF_HOME
              value: /models
            {{- if .Values.engine.hfTokenSecret.name }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.engine.hfTokenSecret.name }}
                  key: {{ .Values.engine.hfTokenSecret.key }}
            {{- end }}
            {{- if .Values.engine.apiKeySecret.name }}
            # Both servers read the key they require on their own endpoint from this
            # variable; neither of them knows anything about a tenant.
            - name: {{ if eq .Values.engine.mode "sglang" }}SGLANG_API_KEY{{ else }}VLLM_API_KEY{{ end }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.engine.apiKeySecret.name }}
                  key: {{ .Values.engine.apiKeySecret.key }}
            {{- end }}
          # No liveness probe on purpose. Weight loading and CUDA-graph capture can take
          # minutes, and a liveness probe that fires during them produces an endless
          # restart loop; readiness alone keeps a not-yet-warm engine out of the Service,
          # which is the behaviour that matters.
          #
          # GET /health is the probe for both engines: vLLM and SGLang each answer it at
          # the server root, beside the OpenAI routes under /v1, and it is the same path
          # OpenAICompatBackend.health() uses from the gateway.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.engine.securityContext | nindent 12 }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: models
              mountPath: /models
            {{- if .Values.engine.adapters.enabled }}
            - name: adapters
              mountPath: {{ .Values.engine.adapters.mountPath }}
            {{- end }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ printf "%dGi" (int .Values.engine.shmSizeGi) }}
        - name: models
          {{- if .Values.engine.modelCache.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-models" (include "turboserve.engine.fullname" .)) .Values.engine.modelCache.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.engine.adapters.enabled }}
        - name: adapters
          {{- if .Values.engine.adapters.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-adapters" (include "turboserve.fullname" .)) .Values.engine.adapters.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.engine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
