{{/*
Tenant quotas and API-key hashes.

A Secret rather than a ConfigMap even though the keys are stored hashed: the file also
carries the full customer list and their quotas, which is not something to leave readable
by anything that can list ConfigMaps. `helm get values` still shows it, so a production
install should set tenants.create=false and point tenants.existingSecret at a Secret
managed by external-secrets or sealed-secrets.
*/}}
{{- if and .Values.tenants.create (not .Values.tenants.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-tenants" (include "turboserve.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turboserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: fleet-data
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.tenants.key }}: |
    {{- .Values.tenants.config | nindent 4 }}
{{- end }}
