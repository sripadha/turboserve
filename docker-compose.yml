# Single-node stack: gateway + engine + Prometheus + Grafana.
#
# This is the "one GPU box" deployment. It is not how the project is measured (that is a
# vast.ai H100, where there is no nested Docker and everything runs natively -- see
# docs/vastai.md) and not how it is deployed (that is the Helm chart in deploy/helm) -- it
# is the shortest path from a clone to a working gateway with dashboards attached.
#
#   docker compose up -d                       gateway (mock engine) + Prometheus + Grafana
#   docker compose --profile gpu up -d         also starts vLLM and points the gateway at it
#   docker compose --profile sglang up -d      the same with SGLang instead of vLLM
#
# The default profile needs no GPU and no model: the mock backend emits synthetic tokens
# with the same streaming shape, which is enough to exercise the API, the tenant quotas,
# the metrics and both dashboards. The `gpu` and `sglang` profiles replace it with a real
# production engine, which needs an NVIDIA GPU and the container toolkit. They are two
# profiles rather than two services in one because a single GPU fits one of them at a time;
# start each with its own TURBOSERVE_ENGINE, and the gateway in front of it does not change.
#
#   gateway    http://localhost:8000      /v1/..., /healthz, /readyz, /metrics
#   prometheus http://localhost:9090
#   grafana    http://localhost:3000      admin / admin, dashboard "turboserve gateway"
#   vllm       http://localhost:8001/v1   (gpu profile only)
#   sglang     http://localhost:30000/v1  (sglang profile only)

name: turboserve

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: turboserve-gateway:dev
    # `--engine` takes `config`, `mock`, or the base URL of an OpenAI-compatible server.
    # The default is the in-process mock; the two GPU profiles are driven with
    #   TURBOSERVE_ENGINE=http://vllm:8000/v1     docker compose --profile gpu up -d
    #   TURBOSERVE_ENGINE=http://sglang:30000/v1  docker compose --profile sglang up -d
    # which point the same gateway at the real engine container. Nothing else about the
    # gateway changes between them: both servers speak the same OpenAI-compatible API.
    #
    # Host, port, tenants and models are flags rather than TURBOSERVE_* environment
    # variables because `serve` builds its Settings with those four values explicitly.
    command:
      - gateway
      - serve
      - --engine
      - ${TURBOSERVE_ENGINE:-mock}
      - --model
      - ${TURBOSERVE_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --tenants
      - /app/configs/tenants.yaml
      - --models
      - /app/configs/models.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --log-level
      - ${TURBOSERVE_LOG_LEVEL:-INFO}
      - --require-auth
    environment:
      PYTHONUNBUFFERED: "1"
      # Distributed tracing, off unless you point it at a collector. The gateway speaks
      # OTLP/HTTP and nothing else, so any collector terminates it; the quickest one is
      #   docker run -p 4318:4318 otel/opentelemetry-collector:0.140.1
      # with a config that receives otlp/http and exports to wherever you read traces
      # (Jaeger and Tempo both accept OTLP directly, so they work as the endpoint too).
      # The full path is required -- OTLP/HTTP puts traces, metrics and logs on three
      # different ones. Empty is the default and means no tracer is built at all.
      TURBOSERVE_OTEL_ENDPOINT: ${TURBOSERVE_OTEL_ENDPOINT:-}
      TURBOSERVE_OTEL_SERVICE_NAME: ${TURBOSERVE_OTEL_SERVICE_NAME:-turboserve-gateway}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      # Edit configs/tenants.yaml on the host and restart the container to change quotas.
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  vllm:
    # Pinned, not floating: a vLLM minor release can change scheduling behaviour and make a
    # comparison against an earlier run meaningless. The version lands in every result file.
    image: vllm/vllm-openai:v0.11.0
    profiles: ["gpu"]
    command:
      - --model
      - ${TURBOSERVE_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.90"
      # Same two flags the Helm chart enables by default; see deploy/vllm/README.md.
      - --enable-prefix-caching
      - --enable-chunked-prefill
      # FP8 on Hopper is a launch option, not a request parameter, so it is two more flags
      # here rather than anything the gateway sends: append `--quantization fp8` and
      # `--kv-cache-dtype fp8` to serve the same checkpoint as W8A8-FP8 with an fp8 KV
      # cache (the chart's `engine.quantization: fp8`, and `QUANT=fp8` in
      # deploy/vllm/launch.sh). Not on by default because it needs Ada/Hopper tensor cores
      # and this file is the no-assumptions single-box stack.
    environment:
      HF_HOME: /models
      # Needed only for gated checkpoints; export it in the shell or a .env file.
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${VLLM_PORT:-8001}:8000"
    volumes:
      # Persist the Hugging Face cache so a restart does not re-download the weights.
      - vllm-models:/models
    # The default 64 MB /dev/shm is too small for torch's workers.
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    restart: unless-stopped

  sglang:
    # The official image, pinned rather than floating for the same reason the vLLM tag is:
    # a minor release can change scheduling behaviour and make a comparison against an
    # earlier run meaningless. The version lands in every result file, and the running
    # server reports it on GET /version.
    image: lmsysorg/sglang:v0.5.3
    profiles: ["sglang"]
    entrypoint: ["python3", "-m", "sglang.launch_server"]
    command:
      - --model-path
      - ${TURBOSERVE_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --host
      - "0.0.0.0"
      - --port
      - "30000"
      - --dtype
      - bfloat16
      - --context-length
      - "8192"
      - --mem-fraction-static
      - "0.90"
      # SGLang's counterpart of the two flags the vllm service above enables: the prefill
      # budget per step is what makes prefill chunked, and RadixAttention prefix caching is
      # already on -- it would take --disable-radix-cache to turn it off, which is how the
      # prefix-cache benchmark's control server is started. See deploy/sglang/README.md.
      - --chunked-prefill-size
      - "8192"
      # The FP8 counterpart of the note in the vllm service above, with SGLang's spelling
      # of the KV dtype: append `--quantization fp8` and `--kv-cache-dtype fp8_e5m2`.
    environment:
      HF_HOME: /models
      # Needed only for gated checkpoints; export it in the shell or a .env file.
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${SGLANG_PORT:-30000}:30000"
    volumes:
      # Persist the Hugging Face cache so a restart does not re-download the weights.
      - sglang-models:/models
    # The default 64 MB /dev/shm is too small for torch's workers.
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:30000/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The same rules file the Helm chart embeds in its PrometheusRule, so the alerts here
      # and the alerts in a cluster cannot drift apart.
      - ./deploy/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Local-only stack; there is nothing behind this login worth protecting. Do not
      # expose this port beyond the host.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  vllm-models:
  sglang-models:
